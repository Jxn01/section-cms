name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: none

      - name: Lint all PHP files
        run: |
          set -e
          find . -path ./.git -prune -o -name '*.php' -print | while read -r f; do
            php -l "$f" > /dev/null
          done
          echo "All PHP files linted OK."

      - name: Run test suite
        run: php tests/run.php

  go:
    name: Go deployer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/deployer
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo 'Run gofmt -w .' && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...
